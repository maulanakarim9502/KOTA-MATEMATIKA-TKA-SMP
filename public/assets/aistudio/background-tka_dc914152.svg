<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F3FF"/>
      <stop offset="0.55" stop-color="#F4F0FF"/>
      <stop offset="1" stop-color="#FFF3E3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- soft blobs -->
  <circle cx="140" cy="120" r="260" fill="#BFDDFF" opacity="0.55"/>
  <circle cx="1820" cy="980" r="330" fill="#FFD9A8" opacity="0.5"/>
  <circle cx="1780" cy="90" r="190" fill="#D9C8FF" opacity="0.5"/>
  <circle cx="120" cy="1000" r="220" fill="#BFF0D8" opacity="0.5"/>
  <path d="M0 860 C 300 780, 520 960, 820 890 S 1400 800, 1920 900 L1920 1080 L0 1080 Z" fill="#CFE6FF" opacity="0.45"/>
  <path d="M0 930 C 380 870, 700 1010, 1020 950 S 1560 890, 1920 960 L1920 1080 L0 1080 Z" fill="#B9DBFF" opacity="0.4"/>

  <!-- center calm glow for readability -->
  <ellipse cx="960" cy="540" rx="760" ry="420" fill="url(#glow)"/>

  <!-- math symbols (low opacity) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#3B82F6" opacity="0.22">
    <text x="150" y="330" font-size="120" transform="rotate(-12 150 330)">π</text>
    <text x="330" y="190" font-size="96" transform="rotate(8 330 190)">√</text>
    <text x="1500" y="250" font-size="110" transform="rotate(10 1500 250)">x²</text>
    <text x="1700" y="470" font-size="100" transform="rotate(-8 1700 470)">÷</text>
    <text x="90" y="640" font-size="104" transform="rotate(6 90 640)">%</text>
    <text x="1620" y="760" font-size="110" transform="rotate(-10 1620 760)">=</text>
    <text x="520" y="1010" font-size="96" transform="rotate(-6 520 1010)">+</text>
    <text x="1250" y="130" font-size="90" transform="rotate(-14 1250 130)">−</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#8B5CF6" opacity="0.2">
    <text x="760" y="110" font-size="84" transform="rotate(6 760 110)">a²+b²</text>
    <text x="1380" y="1020" font-size="80" transform="rotate(-5 1380 1020)">c²</text>
  </g>

  <!-- right triangle with right-angle mark -->
  <g transform="translate(260 760) rotate(-8)" opacity="0.35">
    <polygon points="0,0 190,0 0,-140" fill="#FDE68A" stroke="#F59E0B" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="0,-28 28,-28 28,0" fill="none" stroke="#F59E0B" stroke-width="4"/>
  </g>

  <!-- ruler -->
  <g transform="translate(1480 590) rotate(14)" opacity="0.4">
    <rect width="280" height="54" rx="8" fill="#FCA5A5" stroke="#EF4444" stroke-width="4"/>
    <g stroke="#EF4444" stroke-width="3">
      <line x1="25" y1="0" x2="25" y2="20"/><line x1="55" y1="0" x2="55" y2="14"/>
      <line x1="85" y1="0" x2="85" y2="20"/><line x1="115" y1="0" x2="115" y2="14"/>
      <line x1="145" y1="0" x2="145" y2="20"/><line x1="175" y1="0" x2="175" y2="14"/>
      <line x1="205" y1="0" x2="205" y2="20"/><line x1="235" y1="0" x2="235" y2="14"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(1180 880) rotate(-35)" opacity="0.45">
    <rect width="230" height="38" rx="6" fill="#FDBA74" stroke="#EA580C" stroke-width="4"/>
    <polygon points="230,0 275,19 230,38" fill="#FDE68A" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="258,12 275,19 258,26" fill="#374151"/>
    <rect width="34" height="38" rx="6" fill="#F9A8D4" stroke="#EA580C" stroke-width="4"/>
  </g>

  <!-- open book -->
  <g transform="translate(420 90)" opacity="0.4">
    <path d="M0 30 C 60 0, 120 0, 150 28 L150 150 C 120 128, 60 128, 0 150 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
    <path d="M300 30 C 240 0, 180 0, 150 28 L150 150 C 180 128, 240 128, 300 150 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#93C5FD" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="55" x2="115" y2="52"/><line x1="30" y1="80" x2="115" y2="77"/><line x1="30" y1="105" x2="115" y2="102"/>
      <line x1="185" y1="52" x2="270" y2="55"/><line x1="185" y1="77" x2="270" y2="80"/>
    </g>
  </g>

  <!-- voice wave (Voice AI) -->
  <g transform="translate(1530 880)" fill="#10B981" opacity="0.4">
    <rect x="0" y="-20" width="14" height="40" rx="7"/>
    <rect x="26" y="-45" width="14" height="90" rx="7"/>
    <rect x="52" y="-70" width="14" height="140" rx="7"/>
    <rect x="78" y="-35" width="14" height="70" rx="7"/>
    <rect x="104" y="-55" width="14" height="110" rx="7"/>
    <rect x="130" y="-25" width="14" height="50" rx="7"/>
    <rect x="156" y="-12" width="14" height="24" rx="7"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(170 440)" opacity="0.45">
    <path d="M20 0 H190 A20 20 0 0 1 210 20 V90 A20 20 0 0 1 190 110 H90 L50 145 L55 110 H20 A20 20 0 0 1 0 90 V20 A20 20 0 0 1 20 0 Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="65" cy="55" r="9" fill="#8B5CF6"/><circle cx="105" cy="55" r="9" fill="#8B5CF6"/><circle cx="145" cy="55" r="9" fill="#8B5CF6"/>
  </g>

  <!-- balance scale (timbangan) -->
  <g transform="translate(1640 250)" opacity="0.4" stroke="#0EA5E9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="80" y1="0" x2="80" y2="150"/>
    <line x1="30" y1="150" x2="130" y2="150"/>
    <line x1="0" y1="28" x2="160" y2="28"/>
    <path d="M0 28 L-18 90 H18 Z" fill="#BAE6FD"/>
    <path d="M160 28 L142 90 H178 Z" fill="#BAE6FD"/>
  </g>

  <!-- bubbles / dots -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="620" cy="280" r="9"/><circle cx="1090" cy="210" r="7"/><circle cx="1330" cy="330" r="10"/>
    <circle cx="300" cy="560" r="8"/><circle cx="1010" cy="900" r="9"/><circle cx="760" cy="840" r="6"/>
    <circle cx="1760" cy="620" r="8"/><circle cx="210" cy="900" r="7"/>
  </g>
  <g fill="none" stroke="#60A5FA" stroke-width="4" opacity="0.35">
    <circle cx="700" cy="170" r="22"/><circle cx="1240" cy="960" r="26"/><circle cx="60" cy="420" r="18"/><circle cx="1860" cy="300" r="20"/>
  </g>

  <!-- stars -->
  <g fill="#FBBF24" opacity="0.7">
    <polygon points="0,-30 9,-9 31,-9 13,5 20,27 0,14 -20,27 -13,5 -31,-9 -9,-9" transform="translate(900 150) scale(0.9)"/>
    <polygon points="0,-30 9,-9 31,-9 13,5 20,27 0,14 -20,27 -13,5 -31,-9 -9,-9" transform="translate(1600 130) scale(0.7)"/>
    <polygon points="0,-30 9,-9 31,-9 13,5 20,27 0,14 -20,27 -13,5 -31,-9 -9,-9" transform="translate(120 780) scale(0.8)"/>
    <polygon points="0,-30 9,-9 31,-9 13,5 20,27 0,14 -20,27 -13,5 -31,-9 -9,-9" transform="translate(1860 840) scale(0.9)"/>
    <polygon points="0,-30 9,-9 31,-9 13,5 20,27 0,14 -20,27 -13,5 -31,-9 -9,-9" transform="translate(860 990) scale(0.6)"/>
  </g>
</svg>
